<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3 - Events</title>
    <link rel="stylesheet" href="style.css">
    <script src="events.js" defer></script>
</head>
<body>
    <h1>Assignment 5</h1>
    <nav>
        <a href="index.html">Part 1: Basics</a>
        <a href="dom.html">Part 2: DOM</a>
        <a href="events.html">Part 3: Events</a>
        <a href="todo.html">Part 4: To-Do List</a>
    </nav>
    <main>
        <h2>Part 3. Events</h2>
        <section>
            <h3>Task 5. Mouse Events</h3>
            <div id="hover-box" class="box">Move your mouse over this box.</div>
        </section>
        <section>
            <h3>Task 6. Keyboard Events</h3>
            <label for="typing-input">Type something:</label>
            <input id="typing-input" type="text">
            <p>Current value: <span id="typing-output"></span></p>
        </section>
        <section>
            <h3>Task 7. Calculator</h3>
            <label for="first-number">First number:</label>
            <input id="first-number" type="number" step="any">
            <label for="second-number">Second number:</label>
            <input id="second-number" type="number" step="any">
            <div>
                <button id="add">+</button>
                <button id="subtract">-</button>
                <button id="multiply">*</button>
                <button id="divide">/</button>
            </div>
            <p id="result" aria-live="polite">Result:</p>
        </section>
    </main>
</body>
</html>
